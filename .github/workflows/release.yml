name: release
# Builds the desktop installers. Run it by hand, or push a tag like v0.1.0 to attach them to a release.
# Windows and Linux only. The macOS DMG is signed and notarized locally (see README) and
# attached to the release by hand.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, target: "" }
          - { os: ubuntu-24.04, platform: linux, target: "--target ubuntu:24.04" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install briefcase
      - run: briefcase create ${{ matrix.platform }} ${{ matrix.target }} --no-input
      - run: briefcase build ${{ matrix.platform }} ${{ matrix.target }} --no-input
      - run: briefcase package ${{ matrix.platform }} ${{ matrix.target }} --no-input
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefcase-logs-${{ matrix.platform }}
          path: logs/*
      - uses: actions/upload-artifact@v4
        with:
          name: refolio-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*, draft: true }
