name: release
# Builds the desktop installers. Run it by hand, or push a tag like v0.1.0 to attach them to a release.
# macOS here is unsigned; sign and notarize locally (see README) for the public download.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  package:
    strategy:
      matrix:
        include:
          - { os: macos-latest, platform: macOS, args: "--adhoc-sign" }
          - { os: windows-latest, platform: windows, args: "" }
          - { os: ubuntu-latest, platform: linux, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install briefcase
      - run: briefcase create ${{ matrix.platform }} --no-input
      - run: briefcase build ${{ matrix.platform }} --no-input
      - run: briefcase package ${{ matrix.platform }} --no-input ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: refolio-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*, draft: true }
